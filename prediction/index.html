<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMOS Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #6a4bbc;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #6a4bbc;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #54399c;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PMOS Prediction</h1>

    <p class="description">
        Enter your details to check the predicted PCOS risk.
    </p>

    <form id="predictionForm">

        <label>Age</label>
        <input type="number" id="age" required>

        <label>Weight (Kg)</label>
        <input type="number" id="weight" step="0.01" required>

        <label>Height (Cm)</label>
        <input type="number" id="height" step="0.01" required>

        <label>BMI</label>
        <input type="number" id="bmi" step="0.01" required>

        <label>Cycle</label>
        <select id="cycle" required>
            <option value="0">Regular</option>
            <option value="1">Irregular</option>
        </select>

        <label>Cycle Length (Days)</label>
        <input type="number" id="cycle_length" required>

        <label>Weight Gain</label>
        <select id="weight_gain" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label>Hair Growth</label>
        <select id="hair_growth" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label>Pimples</label>
        <select id="pimples" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <button type="submit">
            Predict PCOS
        </button>

    </form>

    <div id="message"></div>

</div>


<script>

document.getElementById("predictionForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const message = document.getElementById("message");

        message.innerHTML = "Predicting...";


        const data = {

            age: Number(document.getElementById("age").value),

            weight: Number(document.getElementById("weight").value),

            height: Number(document.getElementById("height").value),

            bmi: Number(document.getElementById("bmi").value),

            cycle: Number(document.getElementById("cycle").value),

            cycle_length:
                Number(document.getElementById("cycle_length").value),

            weight_gain:
                Number(document.getElementById("weight_gain").value),

            hair_growth:
                Number(document.getElementById("hair_growth").value),

            pimples:
                Number(document.getElementById("pimples").value)
        };


        try {

            const response = await fetch(
                "/api/predict/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)
                }
            );


            const result = await response.json();


            if (response.ok) {

                // Save prediction result
                localStorage.setItem(
                    "pcosPrediction",
                    result.prediction
                );

                localStorage.setItem(
                    "pcosProbability",
                    result.probability
                );

                localStorage.setItem(
                    "pcosResult",
                    result.result
                );


                // Go to result page
                window.location.href = "/result/";

            } else {

                message.innerHTML =
                    "Error: " +
                    (result.error || "Prediction failed");

            }

        } catch (error) {

            message.innerHTML =
                "Cannot connect to Django backend.";

            console.error(error);
        }

    }
);

</script>

</body>
</html>
