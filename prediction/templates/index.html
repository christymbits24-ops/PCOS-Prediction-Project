* {

.page-header {
    min-height: 390px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 70px 20px;

/* Glowing circle */

select {

footer {

</style>

</head>


<body>


<!-- ================= PAGE HEADER ================= -->

<section class="page-header">

</section>


<!-- ================= CONTENT ================= -->

<div class="container">


    <!-- Prediction Form -->

    <div class="prediction-card">

        <h2>
            🤖 PMOS Risk Prediction
        </h2>

        <p class="description">
            Enter your details to check the predicted PMOS risk.
        </p>


        <form id="predictionForm">


            <label>
                Age
            </label>

            <input type="number"
                   id="age"
                   required>


            <label>
                Weight (Kg)
            </label>

            <input type="number"
                   id="weight"
                   step="0.01"
                   required>


            <label>
                Height (Cm)
            </label>

            <input type="number"
                   id="height"
                   step="0.01"
                   required>


            <label>
                BMI
            </label>

            <!-- BMI is automatically calculated -->
            <input type="number"
                   id="bmi"
                   step="0.01"
                   readonly>


            <label>
                Cycle
            </label>

            <select id="cycle"
                    required>

                <option value="0">
                    Regular
                </option>

                <option value="1">
                    Irregular
                </option>

            </select>


            <label>
                Cycle Length (Days)
            </label>

            <input type="number"
                   id="cycle_length"
                   required>


            <label>
                Weight Gain
            </label>

            <select id="weight_gain"
                    required>

                <option value="0">
                    No
                </option>

                <option value="1">
                    Yes
                </option>

            </select>


            <label>
                Hair Growth
            </label>

            <select id="hair_growth"
                    required>

                <option value="0">
                    No
                </option>

                <option value="1">
                    Yes
                </option>

            </select>


            <label>
                Pimples
            </label>

            <select id="pimples"
                    required>

                <option value="0">
                    No
                </option>

                <option value="1">
                    Yes
                </option>

            </select>


            <button type="submit">
                Predict PMOS
            </button>


        </form>


        <div id="message"></div>

    </div>


    <!-- Information -->

    <div class="info-card">

        <h3>
           
        </h3>

        <p>
           
        </p>

    </div>


</div>


<!-- ================= FOOTER ================= -->

<footer>

    <p>
        🌸 <strong>OvaAssist</strong> - PMOS Health & Wellness
    </p>

    <p>

    </p>

</footer>


<script>


/* ================= CSRF TOKEN ================= */

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {

        const cookies = document.cookie.split(";");

        for (let cookie of cookies) {

            cookie = cookie.trim();

            if (cookie.startsWith(name + "=")) {

                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );

                break;
            }
        }
    }

    return cookieValue;
}


/* ================= AUTOMATIC BMI CALCULATION ================= */

function calculateBMI() {

    const weight =
        parseFloat(
            document.getElementById("weight").value
        );

    const heightCm =
        parseFloat(
            document.getElementById("height").value
        );

    const bmiField =
        document.getElementById("bmi");


    if (weight > 0 && heightCm > 0) {

        const heightM = heightCm / 100;

        const bmi =
            weight / (heightM * heightM);

        bmiField.value = bmi.toFixed(2);

    } else {

        bmiField.value = "";

    }

}


/* Calculate BMI whenever weight changes */

document.getElementById("weight").addEventListener(
    "input",
    calculateBMI
);


/* Calculate BMI whenever height changes */

document.getElementById("height").addEventListener(
    "input",
    calculateBMI
);


/* ================= PREDICTION FORM ================= */

document.getElementById("predictionForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const message =
            document.getElementById("message");

        message.innerHTML = "Predicting...";


        /* ================= GET FORM DATA ================= */

        const data = {

            age:
                Number(
                    document.getElementById("age").value
                ),

            weight:
                Number(
                    document.getElementById("weight").value
                ),

            height:
                Number(
                    document.getElementById("height").value
                ),

            /* BMI is automatically calculated */
            bmi:
                Number(
                    document.getElementById("bmi").value
                ),

            cycle:
                Number(
                    document.getElementById("cycle").value
                ),

            cycle_length:
                Number(
                    document.getElementById("cycle_length").value
                ),

            weight_gain:
                Number(
                    document.getElementById("weight_gain").value
                ),

            hair_growth:
                Number(
                    document.getElementById("hair_growth").value
                ),

            pimples:
                Number(
                    document.getElementById("pimples").value
                )

        };


        /* ================= SEND TO DJANGO ================= */

        try {

            const response = await fetch(
                "/api/predict/",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-CSRFToken":
                            getCookie("csrftoken")

                    },

                    body:
                        JSON.stringify(data)

                }
            );


            /* ================= GET RESPONSE ================= */

            const result =
                await response.json();


            /* ================= SUCCESS ================= */

            if (response.ok) {


                // Save prediction result

               localStorage.setItem(
    "pmosPrediction",
    result.prediction
);

localStorage.setItem(
    "pmosProbability",
    result.probability
);

localStorage.setItem(
    "pmosResult",
    result.result
);


                // Go to result page

                window.location.href =
                    "/result/";

            }


            /* ================= ERROR ================= */

            else {

                message.innerHTML =
                    "Error: " +
                    (result.error ||
                     "Prediction failed");

            }


        }


        /* ================= CONNECTION ERROR ================= */

        catch (error) {

            message.innerHTML =
                "Cannot connect to Django backend.";

            console.error(error);

        }

    }
);


</script>


</body>

</html>
