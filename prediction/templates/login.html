```html
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | OvaAssist</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #35126b, transparent 35%),
                radial-gradient(circle at bottom right, #063c52, transparent 35%),
                #050816;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(15px);

            border-radius: 22px;

            padding: 40px 35px;

            box-shadow:
                0 0 30px rgba(137, 78, 255, 0.25);
        }

        .logo {
            text-align: center;
            color: white;
            font-size: 30px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        .logo span {
            color: #a855f7;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 14px;

            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            color: white;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            color: #e2e8f0;

            font-size: 14px;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.2);

            background: rgba(255,255,255,0.08);

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #a855f7;

            box-shadow:
                0 0 10px rgba(168, 85, 247, 0.3);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);

            border: 1px solid rgba(239, 68, 68, 0.4);

            color: #fca5a5;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 18px;

            text-align: center;

            font-size: 14px;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #7c3aed,
                    #06b6d4
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 20px rgba(124, 58, 237, 0.5);
        }

        .register-link {
            text-align: center;

            margin-top: 25px;

            color: #cbd5e1;

            font-size: 14px;
        }

        .register-link a {
            color: #c084fc;

            text-decoration: none;

            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;

            margin-top: 18px;
        }

        .back-home a {
            color: #94a3b8;

            text-decoration: none;

            font-size: 13px;
        }

        .back-home a:hover {
            color: white;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 30px 22px;
            }

            .logo {
                font-size: 26px;
            }
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            Ova<span>Assist</span>
        </div>

        <div class="subtitle">
            Your Health. Your Awareness. Your Support.
        </div>

        <h2>Welcome Back</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="/register/">
                Register
            </a>

        </div>

        <div class="back-home">

            <a href="/">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
```
